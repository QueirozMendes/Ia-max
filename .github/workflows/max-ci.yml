name: Max CI
on:
  push:
    branches: [main, max-evolution]
  pull_request:
  workflow_dispatch:
concurrency:
  group: max-ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    timeout-minutes: 10
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe de todos os módulos
        run: npm run check
      - name: Executar testes unitários e integração HTTP
        run: npm test
